<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DSS Bansos Bontoramba{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  {% if user %}
  <nav class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
        <i class="bi bi-clipboard2-data"></i>
        <span>DSS Bansos <small class="fw-normal opacity-75">· Bontoramba</small></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/daftar"><i class="bi bi-list-check"></i> Pengajuan</a></li>
          <li class="nav-item"><a class="nav-link" href="/peringkat"><i class="bi bi-trophy"></i> Peringkat</a></li>
          <li class="nav-item"><a class="nav-link" href="/form"><i class="bi bi-plus-square"></i> Baru</a></li>
        </ul>
        <span class="navbar-text me-3 small"><i class="bi bi-person-circle"></i> {{ user.nama }}</span>
        <a class="btn btn-sm btn-outline-light" href="/logout"><i class="bi bi-box-arrow-right"></i> Keluar</a>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="container text-center text-muted small py-4">
    Prototipe DSS Bansos — Fase 0 (kerangka). Model tier masih <em>stub</em>.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</body>
</html>
