{% extends "base.html" %}
{% block title %}Pengajuan Baru — DSS Bansos{% endblock %}
{% block content %}
<a href="/daftar" class="small text-decoration-none">&larr; Kembali</a>
<h1 class="h3 mb-3 mt-1">Pengajuan Baru</h1>
{% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}

<form method="post" action="/form">
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Data Warga (Demografi)</div>
        <div class="card-body">
          <div class="mb-2"><label class="form-label">NIK</label>
            <input name="nik" class="form-control" required minlength="8" maxlength="32"></div>
          <div class="mb-2"><label class="form-label">Nama</label>
            <input name="nama" class="form-control" required></div>
          <div class="row">
            <div class="col-4 mb-2"><label class="form-label">Usia</label>
              <input name="usia" type="number" min="0" max="130" class="form-control" required></div>
            <div class="col-4 mb-2"><label class="form-label">Jenis Kelamin</label>
              <select name="jenis_kelamin" class="form-select" required>
                <option value="L">Laki-laki</option><option value="P">Perempuan</option>
              </select></div>
            <div class="col-4 mb-2"><label class="form-label">Tanggungan</label>
              <input name="jumlah_tanggungan" type="number" min="0" class="form-control" value="0" required></div>
          </div>
          <div class="mb-2"><label class="form-label">Status Pernikahan</label>
            <select name="status_pernikahan" class="form-select" required>
              <option>Belum Kawin</option><option>Kawin</option><option>Cerai Hidup</option><option>Cerai Mati</option>
            </select></div>
          <div class="mb-0"><label class="form-label">Alamat</label>
            <input name="alamat" class="form-control"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Data Ekonomi & Kondisi Rumah</div>
        <div class="card-body">
          <div class="mb-2"><label class="form-label">Pendapatan per kapita / bulan (Rp)</label>
            <input name="pendapatan" type="number" min="0" step="1000" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Status Pekerjaan</label>
            <input name="status_pekerjaan" class="form-control" placeholder="mis. Buruh tani"></div>
          <div class="row">
            <div class="col-6 mb-2 form-check ms-2 mt-2">
              <input class="form-check-input" type="checkbox" name="aset_produktif" id="aset">
              <label class="form-check-label" for="aset">Punya aset produktif</label></div>
            <div class="col-6 mb-2 form-check mt-2">
              <input class="form-check-input" type="checkbox" name="riwayat_bantuan" id="riw">
              <label class="form-check-label" for="riw">Pernah terima bansos</label></div>
          </div>
          <div class="row">
            <div class="col-6 mb-2"><label class="form-label">Luas Rumah (m²)</label>
              <input name="luas_rumah" type="number" min="0" step="0.5" class="form-control"></div>
            <div class="col-6 mb-2"><label class="form-label">Jenis Lantai</label>
              <select name="jenis_lantai" class="form-select">
                <option value="">-</option><option>tanah</option><option>kayu</option><option>semen</option><option>keramik</option>
              </select></div>
          </div>
          <div class="row">
            <div class="col-6 mb-2"><label class="form-label">Jenis Dinding</label>
              <select name="jenis_dinding" class="form-select">
                <option value="">-</option><option>bambu</option><option>kayu</option><option>seng</option><option>tembok</option>
              </select></div>
            <div class="col-6 mb-0"><label class="form-label">Sumber Air</label>
              <select name="sumber_air" class="form-select">
                <option value="">-</option><option>sungai</option><option>sumur</option><option>pdam</option>
              </select></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card">
        <div class="card-header">Teks Naratif (kondisi keluarga / alasan pengajuan)</div>
        <div class="card-body">
          <textarea name="isi_teks" class="form-control" rows="3"
            placeholder="mis. Kepala keluarga sakit kronis, 5 anak masih sekolah, rumah gubuk bocor..."></textarea>
          <input type="hidden" name="sumber_teks" value="petugas">
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary"><i class="bi bi-save"></i> Simpan Pengajuan</button>
    <a href="/daftar" class="btn btn-outline-secondary">Batal</a>
  </div>
</form>
{% endblock %}
