{% extends "base.html" %}
{% block title %}Masuk — DSS Bansos{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4 mt-md-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="display-6" style="color:var(--brand)"><i class="bi bi-clipboard2-data"></i></div>
          <h1 class="h5 mb-0">DSS Bansos</h1>
          <p class="small ink-3 mb-0">Sistem Pendukung Keputusan Penerima Bantuan Sosial</p>
          <p class="small ink-3">Kelurahan Bontoramba</p>
        </div>
        {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Masuk</button>
        </form>
        <p class="small ink-3 text-center mt-3 mb-0">Akun demo: <code>petugas</code> / <code>petugas123</code></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
