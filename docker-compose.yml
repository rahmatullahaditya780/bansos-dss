# Deployment TRD Bab 10 (PostgreSQL + FastAPI dalam kontainer).
# Untuk dev lokal tanpa Docker, jalankan uvicorn langsung dengan DATABASE_URL=sqlite (lihat README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bansos
      POSTGRES_PASSWORD: bansos
      POSTGRES_DB: bansos_dss
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bansos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://bansos:bansos@db:5432/bansos_dss
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
